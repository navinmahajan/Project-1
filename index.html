<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121c">
  <meta name="description" content="A little hello, made with care.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f3ff;
      --muted: #aaa8bc;
      --violet: #a18aff;
      --mint: #82f0d0;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10121c;
      background-image:
        radial-gradient(ellipse at 18% 18%, rgb(117 82 216 / 20%), transparent 38%),
        radial-gradient(ellipse at 82% 82%, rgb(57 180 158 / 14%), transparent 36%);
    }
    .scene { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border: 1px solid rgb(255 255 255 / 9%); border-radius: 50%; }
    .orb-one { width: 420px; height: 420px; top: -250px; right: 8%; }
    .orb-two { width: 600px; height: 600px; bottom: -430px; left: -220px; }
    .card {
      position: relative;
      width: min(100%, 720px);
      padding: clamp(34px, 8vw, 72px);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 28px;
      background: linear-gradient(145deg, rgb(255 255 255 / 8%), rgb(255 255 255 / 3%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 32%), inset 0 1px rgb(255 255 255 / 8%);
      backdrop-filter: blur(18px);
      animation: arrive 850ms cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 30px;
      color: var(--mint);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .spark { font-size: 16px; animation: twinkle 2.5s ease-in-out infinite; }
    h1 {
      margin: 0;
      font-size: clamp(58px, 12vw, 104px);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 750;
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #c5b7ff 4%, #9e8aff 48%, #83ecd0 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }
    .message {
      max-width: 430px;
      margin: 25px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2.5vw, 19px);
      line-height: 1.7;
    }
    .footer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 48px;
      color: #848297;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .footer::before { content: ""; width: 28px; height: 1px; background: linear-gradient(90deg, var(--violet), transparent); }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes twinkle { 50% { transform: rotate(18deg) scale(1.18); opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><span class="orb orb-one"></span><span class="orb orb-two"></span></div>
  <main class="card">
    <p class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A little something for you</p>
    <h1>Hello,<span>world!</span></h1>
    <p class="message">A fresh page, a fresh start. Here’s to the ideas you’ll bring to life from here.</p>
    <div class="footer">Made with a little extra magic</div>
  </main>
</body>
</html>
